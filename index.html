<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão HTML e CSS</title>
</head>
<body>
    <p>Esse é um paragrafo</p><!--Paragrafo-->
    <h1>Título de Nível 1</h1><!--Titulo-->
    <h2>Título de Nível 2</h2>
    <h3>Título de Nível 3</h3>
    <h4>Título de Nível 4</h4>
    <h5>Título de Nível 5</h5>
    <h6>Título de Nível 6</h6>
    <ol><!--Lista Ordenada-->
        <li>Posição 1</li>
        <li>Posição 2</li>
        <li>Posição 3</li>
    </ol>
    <ul><!--Lista não Ordenada-->
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 2</li>        
    </ul>
    <a href="https://google.com.br">Clique aqui</a><!--Âncora-->
    <img src="imagem.png" alt="Foto de Perfil" /><!--Imagem-->
    <nav><!--Navegação-->
        <ul>
            <li>Item</li>
        </ul>
    </nav>
    <main><!--Conteudo Principal-->
        <p>Texto</p>
    </main>
    <div><!--Bloco-->
        <p>Texto</p>
        <p>Texto + <spam>Texto</spam></p><!--spam (Regra de digitação)-->
    </div>

    <!--Criação de tabela-->
    <table>
        <thead>
            <tr>
                <th>col1</th>
                <th>col 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Dado 1</td>
                <td>Dado 2</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Rodapé</td>
            </tr>
        </tfoot>
         <!--holdspan: mesclar linhas-->
         <!--coldspan: mesclar colunas-->
    </table>

    <!--Criação de formulário-->
    <form action="" method="">
        <label for="nome">Informe o nome:</label>
        <input type="text" id="nome" name="nome">

        <label for="desc">Descrição:</label>
        <textarea id="desc" name="desc">Descrição de algo</textarea>

        <label for="opt">Opção:</label>
        <select id="opt" name="opt">
            <option value="1">Valor 1</option>
            <option value="2">Valor 2</option>
        </select>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
